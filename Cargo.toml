[package]
name = "oxideav-av1"
version = "0.1.21"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-av1"
authors = ["Mark Karpeles"]
description = "Pure-Rust AV1 codec — orphan-rebuild scaffold pending clean-room re-implementation."

readme = "README.md"
# The conformance / interop corpora under tests/ (hex-embedded streams) and
# the fuzz harness stay out of the published crate (crates.io 10 MiB cap).
exclude = ["/tests", "/fuzz"]
homepage = "https://github.com/OxideAV/oxideav-av1"
keywords = ["multimedia", "video", "av1", "codec", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::video"]

[dependencies]
# ffmpeg-rs fork: core from our fork so every consumer of ffmpeg-rs resolves the same oxideav-core (no [patch] needed).
oxideav-core = { git = "ssh://git@github.com/ssoj13/oxideav-core.git", branch = "master" }
